<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead-nav-container">
      <a class="masthead-brand" href="{{ '/' | relative_url }}">
        <img class="brand-sprout" src="{{ '/assets/images/sprout-logo.svg' | relative_url }}" alt="sprout icon" width="20" height="20">
        <span>{{ site.masthead_title | default: "s6xybr8in" }}</span>
      </a>

      <div class="masthead-links-wrap">
        <nav class="masthead-nav">
          <ul class="masthead-nav-links">
            {%- for link in site.data.navigation.main -%}
              <li>
                <a class="masthead-nav-link{% if page.url == link.url %} active{% endif %}" href="{{ link.url | relative_url }}">
                  {{ link.title }}
                </a>
              </li>
            {%- endfor -%}
          </ul>
        </nav>

        {% assign github_url = site.author.links | where: "label", "Github" | map: "url" | first | default: "https://github.com/s6xybr8in" %}
        <a class="masthead-github-link" href="{{ github_url }}" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-github"></i>
          <span>GitHub</span>
          <span class="arrow">↗</span>
        </a>
      </div>
    </div>
  </div>
</div>
